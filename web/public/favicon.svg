<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#151d30"/>
    </linearGradient>
    <linearGradient id="g1" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Q ring: outer circle minus inner circle (annulus) -->
  <!-- centered at (210, 256), outer r=148, inner r=92 -->
  <path d="
    M 210 108
    A 148 148 0 1 1 209.99 108
    Z
    M 210 164
    A 92 92 0 1 0 210.01 164
    Z
  " fill="url(#g1)" fill-rule="evenodd"/>

  <!-- Q tail: a clean diagonal bar -->
  <rect x="290" y="310" width="120" height="52" rx="26"
        fill="url(#g1)" transform="rotate(42, 350, 336)"/>

  <!-- B: vertical spine + two bumps, positioned to the right -->
  <!-- Vertical spine of B -->
  <rect x="290" y="118" width="42" height="268" rx="4" fill="url(#g1)"/>

  <!-- B top bump -->
  <path d="M 311 118
           L 360 118
           A 62 62 0 0 1 360 242
           L 311 242 Z" fill="url(#g1)"/>

  <!-- B bottom bump (wider) -->
  <path d="M 311 242
           L 370 242
           A 72 72 0 0 1 370 386
           L 311 386 Z" fill="url(#g1)"/>

  <!-- Cut-outs for B bowls (dark background color) -->
  <!-- Top bowl cutout -->
  <path d="M 318 148
           L 348 148
           A 34 34 0 0 1 348 216
           L 318 216 Z" fill="url(#bg)"/>

  <!-- Bottom bowl cutout -->
  <path d="M 318 268
           L 355 268
           A 42 42 0 0 1 355 364
           L 318 364 Z" fill="url(#bg)"/>
</svg>