[project]
name = "quickbooks-accounting-mcp"
version = "2.0.0"
description = "QuickBooks Online MCP server — 91 tools for accounting, tax prep, and financial analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
