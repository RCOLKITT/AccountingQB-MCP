[project]
name = "accountingqb"
version = "3.0.0"
description = "AccountingQB — 91 AI tools connecting Claude to QuickBooks Online"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AccountingQB", email = "support@accountingqb.com" }
]
keywords = ["mcp", "quickbooks", "accounting", "claude", "ai", "bookkeeping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://accountingqb.com"
Documentation = "https://accountingqb.com/docs"
Repository = "https://github.com/RCOLKITT/AccountingQB-MCP"

[project.scripts]
accountingqb = "accountingqb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accountingqb"]
