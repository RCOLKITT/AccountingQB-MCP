name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest respx black ruff -r requirements.txt
      - run: black --check mcpb/src accountingqb-local scripts tests server.py   # format (BLOCKING — G10 python half)
      - run: ruff check mcpb/src accountingqb-local scripts server.py            # lint (BLOCKING — G9, curated F+I; config in pyproject)
      - run: python -m pytest tests/ -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fail if a secret or a live QuickBooks realm id landed in a tracked file
      # (e.g. an internal doc committed to the public repo).
      - run: bash scripts/scan-secrets.sh

  # VASPERA-SPINE §3 gates that are green today — BLOCKING.
  theater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/scan-theater.sh

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit                              # typecheck (Constitution: typed web endpoints)
      - run: cd web && npm run format:check                          # prettier (BLOCKING — format gate, G10)

  # Installed-and-red beats absent (VASPERA-SPINE §3): runs and is VISIBLE but does not block merges
  # yet — cleanup is a declared gap (SPINE-STATUS: dep advisories, ESLint). Prettier + black + ruff
  # (curated F+I) are now BLOCKING (G10 + G9 python).
  quality-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt                           # python dep advisories (report-only)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm audit --audit-level=high                  # web dep advisories (report-only, G7)
