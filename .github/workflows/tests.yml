name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pytest respx -r requirements.txt
      - run: python -m pytest tests/ -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Fail if a secret or a live QuickBooks realm id landed in a tracked file
      # (e.g. an internal doc committed to the public repo).
      - run: bash scripts/scan-secrets.sh

  # VASPERA-SPINE §3 gates that are green today — BLOCKING.
  theater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/scan-theater.sh

  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit                              # typecheck (Constitution: typed web endpoints)
      - run: cd web && npm run format:check                          # prettier (BLOCKING — format gate, G10)

  # Installed-and-red beats absent (VASPERA-SPINE §3): runs and is VISIBLE but does not block merges
  # yet — cleanup is a declared gap (SPINE-STATUS: ruff ~144, ESLint, dep advisories). Prettier is now
  # blocking in web-checks (G10 web half done).
  quality-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff pip-audit
      - run: ruff check mcpb/src accountingqb-local                  # python lint (report-only: ~144)
      - run: pip-audit -r requirements.txt                           # dependency advisories (report-only)
