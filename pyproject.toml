[project]
name = "accountingqb-mcp"
version = "2.0.0"
description = "The most comprehensive QuickBooks Online MCP server for Claude — 91 tools for transactions, reports, tax prep, and smart bookkeeping"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ryan Colkitt", email = "ryan@vasperacapital.com"},
]
keywords = ["mcp", "quickbooks", "accounting", "claude", "ai", "bookkeeping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/RCOLKITT/AccountingQB-MCP"
Repository = "https://github.com/RCOLKITT/AccountingQB-MCP"
Issues = "https://github.com/RCOLKITT/AccountingQB-MCP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
accountingqb = "server:mcp.run"
