[project]
name = "accountingqb-mcp"
version = "2.0.0"
description = "The most comprehensive QuickBooks Online MCP server for Claude — 94 tools for transactions, reports, tax prep, and smart bookkeeping"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Ryan Colkitt", email = "ryan@vasperacapital.com"},
]
keywords = ["mcp", "quickbooks", "accounting", "claude", "ai", "bookkeeping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/RCOLKITT/AccountingQB-MCP"
Repository = "https://github.com/RCOLKITT/AccountingQB-MCP"
Issues = "https://github.com/RCOLKITT/AccountingQB-MCP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Note: the published PyPI package is built from mcpb/pyproject.toml (which
# exposes `accountingqb = "accountingqb.__main__:main"`). This root project
# is for local/dev installs; `python server.py` is the primary OSS entry
# point. The root server.py is a thin shim over mcpb/src/accountingqb.
[project.scripts]
accountingqb = "server:main"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
