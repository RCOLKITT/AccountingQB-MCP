[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accountingqb-setup"
version = "0.1.0"
description = "Setup helper for the AccountingQB MCP server in Claude Desktop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AccountingQB", email = "support@accountingqb.com" }
]
keywords = ["accountingqb", "claude", "mcp", "quickbooks", "setup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
accountingqb-setup = "accountingqb_setup.__main__:app"

[project.urls]
Homepage = "https://accountingqb.com"
Documentation = "https://accountingqb.com/docs/setup"
Repository = "https://github.com/RCOLKITT/AccountingQB-MCP"

[tool.hatch.build.targets.wheel]
packages = ["src/accountingqb_setup"]
