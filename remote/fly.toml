# Fly.io config for the remote MCP service (https://mcp.accountingqb.com/mcp)
# Deploy from the repo root: fly deploy --config remote/fly.toml --dockerfile remote/Dockerfile

app = "accountingqb-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RESOURCE_URL = "https://mcp.accountingqb.com"
  AS_URL = "https://accountingqb.com"
  QB_API_URL = "https://accountingqb.com"
  # MCP_JWT_SECRET is a secret: fly secrets set MCP_JWT_SECRET=...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one machine warm — MCP clients are latency-sensitive on connect.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
